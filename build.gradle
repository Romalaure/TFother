plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.3.0'
group = 'fr.timefield.tfother'
base { archivesName = 'TFother' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    compileOnly 'vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE:api'
    runtimeOnly 'vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE'
    // Simple Voice Chat is optional: Tiplouf listens and talks through it when it is installed.
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.0'
}

neoForge {
    version = '21.1.172'
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        tfother { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
